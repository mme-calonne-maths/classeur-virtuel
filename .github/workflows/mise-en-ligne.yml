# Met les classeurs en ligne (GitHub Pages) à chaque modification : refait le sommaire, puis publie.
# Deux étapes séparées, comme le modèle officiel de GitHub, et un second essai automatique
# si GitHub ne retrouve pas tout de suite le paquet à publier (« No artifacts named github-pages »).
name: Mise en ligne du classeur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une mise en ligne à la fois ; celle en cours va jusqu'au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refaire le sommaire des classeurs
        run: node tools/construire-sommaire.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publier:
    needs: preparer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai2.outputs.page_url || steps.essai1.outputs.page_url }}
    steps:
      - id: essai1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attendre avant un second essai
        if: steps.essai1.outcome == 'failure'
        run: sleep 45
      - id: essai2
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v4
